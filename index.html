<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#36613f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Willow">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest?v=4">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=4">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=4">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=4">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<script>window.WILLOW_EMBED = true;</script>
<title>Willow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lexend:wght@500;600&display=swap">
</head>
<body>
<style>
/* Layout: one-column phone app. Sticky header, scrolling content, fixed bottom tab bar, full-screen follow-along overlay.
   Natural palette: moss, river, ochre, clay and dusk on a pale sage-stone ground (light) or deep forest (dark). Large type throughout. */
:root{
  --bg:#f1f3ec; --surface:#fbfcf8; --sunk:#e5e9dd; --line:#d1d8c8;
  --ink:#1c2620; --ink-2:#47544a; --ink-3:#66726a;
  --accent:#36613f; --accent-ink:#ffffff; --accent-soft:#dbe7d7;
  --c-chair:#36613f; --c-balance:#2d6580; --c-taichi:#765610; --c-stretch:#954629; --c-mobility:#57568a;
  --tip-bg:#f4ecd6; --tip-ink:#5a4208;
  --scrim:rgba(20,28,22,.45);
  --display:'Lexend','Avenir Next','Segoe UI',system-ui,sans-serif;
  --body:'Atkinson Hyperlegible','Verdana',system-ui,sans-serif;
  --r:18px; --gut:16px;
  font-size:18px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#121813; --surface:#1a221c; --sunk:#243026; --line:#324035;
    --ink:#e7ede4; --ink-2:#b2bdb3; --ink-3:#8e9a90;
    --accent:#93c59b; --accent-ink:#0f1a12; --accent-soft:#25392b;
    --c-chair:#93c59b; --c-balance:#8cc3de; --c-taichi:#dcbc6b; --c-stretch:#e9a083; --c-mobility:#b4b3e2;
    --tip-bg:#2e2a1c; --tip-ink:#e8d39b;
    --scrim:rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121813; --surface:#1a221c; --sunk:#243026; --line:#324035;
  --ink:#e7ede4; --ink-2:#b2bdb3; --ink-3:#8e9a90;
  --accent:#93c59b; --accent-ink:#0f1a12; --accent-soft:#25392b;
  --c-chair:#93c59b; --c-balance:#8cc3de; --c-taichi:#dcbc6b; --c-stretch:#e9a083; --c-mobility:#b4b3e2;
  --tip-bg:#2e2a1c; --tip-ink:#e8d39b;
  --scrim:rgba(0,0,0,.6);
}
/* Text sizes: standard 16 · medium 18 (default, on :root) · large 21 · extra large 24 · largest 27 */
:root[data-size="standard"]{font-size:16px}
:root[data-size="large"]{font-size:21px}
:root[data-size="xlarge"]{font-size:24px}
:root[data-size="largest"]{font-size:27px}

*{box-sizing:border-box}
html{height:100%}
body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1rem;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:10px}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:600;text-wrap:balance;line-height:1.15}
p{margin:0}
svg{flex:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* Shell */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.hdr-in{max-width:560px;margin:0 auto;padding:10px var(--gut);display:flex;align-items:center;gap:12px;min-height:60px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:600;font-size:1.3rem;color:var(--accent)}
.brand svg{width:1.5rem;height:1.5rem}
.hdr .spacer{flex:1}
.size-btn{min-height:48px;padding:0 16px;border-radius:999px;background:var(--sunk);font-family:var(--display);font-weight:600;font-size:1rem;display:inline-flex;align-items:center;gap:6px}
main{max-width:560px;margin:0 auto;padding-inline:var(--gut);padding-block:18px calc(120px + env(safe-area-inset-bottom,0px))}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(8px + env(safe-area-inset-bottom,0px))}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;min-height:64px;border-radius:14px;color:var(--ink-2);font-size:min(.82rem,16px);font-weight:700;min-width:0;overflow-wrap:anywhere;text-align:center;line-height:1.15}
.tab svg{width:28px;height:28px}
.tab.on{color:var(--accent);background:var(--accent-soft)}

/* Type + common */
.page-h{font-size:1.75rem;margin-bottom:6px}
.lede{color:var(--ink-2);margin-bottom:18px}
.sec-h{font-size:1.15rem;margin:30px 0 12px}
.stack{display:flex;flex-direction:column;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:60px;padding:12px 22px;border-radius:16px;font-family:var(--display);font-weight:600;font-size:1.1rem;background:var(--sunk);color:var(--ink);text-decoration:none;text-align:center}
.btn svg{width:1.4rem;height:1.4rem}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.wide{width:100%}
.btn.quiet{background:transparent;border:2px solid var(--line)}
.btn.small{min-height:52px;font-size:1rem;padding:10px 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;font-weight:700;padding:4px 12px;border-radius:999px;background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.tag.cat{color:var(--cc);background:color-mix(in srgb,var(--cc) 14%,var(--surface))}
.tag svg{width:1rem;height:1rem}
.muted{color:var(--ink-2)}
.tip{display:flex;gap:10px;background:var(--tip-bg);color:var(--tip-ink);border-radius:14px;padding:14px 16px;font-size:.95rem}
.tip svg{width:1.3rem;height:1.3rem;margin-top:2px}
.tip b{display:block}

/* Today */
.hello{font-size:1.9rem;margin-bottom:4px}
.date{color:var(--ink-2);margin-bottom:18px}
.today-card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.today-card::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:var(--cc)}
.eyebrow{font-size:.85rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.today-card h2{font-size:1.6rem}
.prog-meta{display:flex;flex-wrap:wrap;gap:8px}
.ex-mini{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;color:var(--ink-2)}
.ex-mini li{display:flex;gap:10px;align-items:baseline}
.ex-mini li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--cc);flex:none;transform:translateY(-2px)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.85rem;font-weight:700;color:var(--ink-3)}
.wd i{width:100%;max-width:44px;aspect-ratio:1;border-radius:50%;background:var(--sunk);display:grid;place-items:center;color:var(--accent-ink)}
.wd i svg{width:60%;height:60%}
.wd.hit i{background:var(--accent)}
.wd.now{color:var(--ink)}
.wd.now i{box-shadow:0 0 0 2px var(--ink-2)}
.week-note{margin-top:12px;color:var(--ink-2)}

/* Program cards + list rows */
.p-card{display:flex;flex-direction:column;gap:10px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-left:8px solid var(--cc);border-radius:var(--r);padding:16px 18px}
.p-card h3{font-size:1.25rem}
.p-card .go{display:flex;align-items:center;gap:6px;color:var(--accent);font-family:var(--display);font-weight:600}
.p-card .go svg{width:1.2rem;height:1.2rem}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin:0 calc(var(--gut) * -1) 6px;padding-inline:var(--gut);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{min-height:48px;padding:0 16px;border-radius:999px;background:var(--surface);border:2px solid var(--line);font-weight:700;font-size:.95rem;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0 4px}
.switch{width:64px;height:38px;border-radius:999px;background:var(--line);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:30px;height:30px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(26px)}
.ex-row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 4px;border-bottom:1px solid var(--line);min-height:76px}
.ex-ico{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;color:var(--cc);background:color-mix(in srgb,var(--cc) 14%,var(--surface));flex:none}
.ex-ico svg{width:30px;height:30px}
.ex-row .t{font-weight:700;font-size:1.05rem;line-height:1.25}
.ex-row .s{color:var(--ink-2);font-size:.92rem}
.ex-row .txt{flex:1;min-width:0}
.ex-row .fav{color:var(--c-stretch)}
.ex-row .fav svg{width:1.2rem;height:1.2rem}
.chev{color:var(--ink-3);width:1.3rem;height:1.3rem}
.empty{text-align:center;padding:30px 10px;color:var(--ink-2)}

/* Detail + follow-along shared */
.back{display:inline-flex;align-items:center;gap:6px;min-height:52px;font-family:var(--display);font-weight:600;color:var(--accent);margin:-6px 0 6px -4px;padding:0 6px}
.back svg{width:1.3rem;height:1.3rem}
.d-title{font-size:1.8rem;margin:6px 0 10px}
.d-tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.dose{font-family:var(--display);font-weight:600;font-size:1.25rem;margin-bottom:16px}
.video{border-radius:16px;overflow:hidden;background:#000;aspect-ratio:16/9;max-width:100%;width:100%}
.video iframe{width:100%;height:100%;border:0;display:block}
.vid-src{font-size:.88rem;color:var(--ink-2);margin-top:8px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.vid-src a{font-weight:700}
.watch{display:flex;align-items:center;gap:14px;width:100%;text-decoration:none;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px 16px;min-height:76px}
.watch .play{width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.watch .play svg{width:26px;height:26px;margin-left:3px}
.watch .t{font-family:var(--display);font-weight:600;font-size:1.1rem}
.watch .s{font-size:.88rem;color:var(--ink-2)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;counter-reset:s}
.steps li{display:flex;gap:14px;align-items:flex-start;font-size:1.05rem}
.steps li::before{counter-increment:s;content:counter(s);width:2rem;height:2rem;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-family:var(--display);font-weight:600;display:grid;place-items:center;flex:none;font-size:.95rem}
.act-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}

/* Follow-along overlay */
.fa{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px)}
.fa-top{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line)}
.fa-top-in{max-width:560px;margin:0 auto;padding:8px var(--gut);display:flex;align-items:center;gap:12px;min-height:64px}
.fa-top .count{font-family:var(--display);font-weight:600;font-size:1.05rem;flex:1}
.bar{height:8px;background:var(--sunk)}
.bar>div{height:100%;background:var(--accent);transition:width .3s}
.fa-body{max-width:560px;margin:0 auto;padding-inline:var(--gut);padding-block:16px calc(150px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.fa-foot{position:fixed;left:0;right:0;bottom:0;z-index:3;background:var(--surface);border-top:1px solid var(--line);padding:10px var(--gut) calc(12px + env(safe-area-inset-bottom,0px))}
.fa-foot-in{max-width:528px;margin:0 auto;display:grid;grid-template-columns:1fr 2fr;gap:10px}
.timer{display:flex;align-items:center;gap:18px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px}
.ring{position:relative;width:120px;height:120px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .tr{fill:none;stroke:var(--sunk);stroke-width:10}
.ring .pr{fill:none;stroke:var(--accent);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .9s linear}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:1.9rem;font-variant-numeric:tabular-nums}
.timer{flex-wrap:wrap;justify-content:center}
.timer-side{display:flex;flex-direction:column;gap:10px;flex:1 1 9.5rem;min-width:0}
.timer-side .lbl{font-weight:700;color:var(--ink-2)}
.timer-side .done-msg{font-weight:700;color:var(--accent)}
.stop-note{font-size:.9rem;color:var(--ink-2);text-align:center}
.confirm{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:16px}
.finish{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;padding-top:20px}
.finish .leaf{width:96px;height:96px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.finish .leaf svg{width:56px;height:56px}
.finish h2{font-size:2rem}
.feel{display:grid;grid-template-columns:1fr;gap:10px;width:100%}
.feel .btn.on{background:var(--accent);color:var(--accent-ink)}

/* Sheet */
.sheet-wrap{position:fixed;inset:0;z-index:60;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:24px 24px 0 0;padding:20px var(--gut) calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.sizes{display:flex;flex-direction:column;gap:8px}
.opt .sample{font-family:var(--display);font-weight:600;width:3.4rem;flex:none;text-align:center;line-height:1}
.opt .lbl{display:flex;flex-direction:column;min-width:0}
.opt .lbl b{font-weight:700}
.opt .lbl span{font-size:.85rem;color:var(--ink-2)}
.sheet h2{font-size:1.35rem}
.opt{display:flex;align-items:center;gap:14px;min-height:64px;padding:10px 16px;border-radius:14px;border:2px solid var(--line);text-align:left;width:100%}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}

/* My Week */
.log-item{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.date-chip{width:58px;flex:none;border-radius:14px;background:var(--sunk);display:flex;flex-direction:column;align-items:center;padding:6px 0}
.date-chip span{font-size:.8rem;font-weight:700;color:var(--ink-2)}
.date-chip b{font-family:var(--display);font-size:1.5rem;line-height:1.1}
.log-item .t{font-weight:700}
.log-item .s{color:var(--ink-2);font-size:.92rem}
.set-group{display:flex;flex-direction:column;gap:10px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--sunk);border-radius:14px;padding:5px}
.seg button{min-height:52px;border-radius:10px;font-weight:700}
.seg button.on{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.help p+p{margin-top:10px}
.help ol{margin:8px 0 0;padding-left:1.3rem;display:flex;flex-direction:column;gap:6px}
.fine{font-size:.85rem;color:var(--ink-2);margin-top:22px}

/* Tour */
.tour-layer{position:fixed;inset:0;z-index:80}
.tour-layer.dim{background:var(--scrim)}
.tour-hole{position:fixed;border-radius:18px;box-shadow:0 0 0 9999px var(--scrim),0 0 0 4px var(--accent);pointer-events:none}
.tour-card{position:fixed;left:var(--gut);right:var(--gut);max-width:528px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 12px 40px rgba(0,0,0,.28);display:flex;flex-direction:column;gap:12px;overflow-y:auto;max-height:calc(100% - 20px)}
.tour-card.center{top:50%;transform:translateY(-50%);max-height:calc(100% - 32px)}
.tour-card h2{font-size:1.4rem}
.tour-text{font-size:1.05rem}
.tour-list{margin:10px 0;padding-left:1.4rem;display:flex;flex-direction:column;gap:6px}
.tour-pic{width:72px;height:72px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.tour-pic svg{width:40px;height:40px}
.tour-dots{display:flex;gap:6px;flex-wrap:wrap}
.tour-dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.tour-dots i.past{background:var(--accent-soft)}
.tour-dots i.on{background:var(--accent);width:24px;border-radius:5px}
.tour-card{padding-bottom:0}
.tour-foot{position:sticky;bottom:0;margin-top:auto;background:var(--surface);padding-block:8px 16px;display:flex;flex-direction:column;align-items:stretch}
.tour-btns{display:grid;grid-template-columns:1fr 1.6fr;gap:10px}
.tour-skip{min-height:44px;font-weight:700;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px}
@media (prefers-reduced-motion: reduce){.tour-hole{transition:none}}
</style>

<header class="hdr"><div class="hdr-in">
  <div class="brand" aria-label="Willow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c0 6-1 10-4 13"/><path d="M12 3c0 6 1 10 4 13"/><path d="M12 3v18"/><path d="M8 16c-1 2-1 4 0 5"/><path d="M16 16c1 2 1 4 0 5"/></svg>Willow</div>
  <div class="spacer"></div>
  <button class="size-btn" id="size-btn" aria-label="Text size">A<span style="font-size:1.25em">A</span></button>
</div></header>
<main id="main"></main>
<nav class="tabs" aria-label="Sections"><div class="tabs-in" id="tabs"></div></nav>
<div id="overlay"></div>

<script>
(() => {
'use strict';
const EMBED = !!window.WILLOW_EMBED;

/* ---------- Icons ---------- */
const I = {
  today:'<path d="M3 12l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>',
  programs:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',
  exercises:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
  week:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  chair:'<path d="M7 3v9h10V3"/><path d="M5 12h14v3H5z"/><path d="M7 15v6M17 15v6"/>',
  balance:'<circle cx="12" cy="4.5" r="2"/><path d="M12 7v7M12 14l-2 7M12 14l4 3"/><path d="M5 10h14"/>',

/* ---------- Speech ---------- */
const canSpeak = 'speechSynthesis' in window;
let speaking = null;
function speak(ex, btn){
  if (!canSpeak) return;
  try {
    if (speaking === ex.id) { speechSynthesis.cancel(); speaking = null; refreshSpeakBtns(); return; }
    speechSynthesis.cancel();
    const text = `${ex.name}. ${ex.dose}. ${ex.steps.map((s, i) => `Step ${i+1}. ${s}`).join(' ')} Safety tip. ${ex.tip}`;
    const u = new SpeechSynthesisUtterance(text); u.rate = .88;
    u.onend = u.onerror = () => { speaking = null; refreshSpeakBtns(); };
    speaking = ex.id; speechSynthesis.speak(u); refreshSpeakBtns();
  } catch { speaking = null; }
}
function refreshSpeakBtns(){
  document.querySelectorAll('[data-speak]').forEach(b => {
    const on = speaking === b.dataset.speak;
    b.innerHTML = `${ico(on ? 'stopS' : 'speak')}${on ? 'Stop reading' : 'Read aloud'}`;
  });
}

/* ---------- Chime + wake lock ---------- */
let actx = null;
function chime(){
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    [523.25, 659.25, 783.99].forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + i * .18;
      o.type = 'sine'; o.frequency.value = f; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.25, t + .03); g.gain.exponentialRampToValueAtTime(.0001, t + .7);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + .75);
    });
  } catch {}
  try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch {}
}
let wake = null;
async function keepAwake(on){
  try {
    if (on && 'wakeLock' in navigator) { wake = await navigator.wakeLock.request('screen'); }
    else if (!on && wake) { await wake.release(); wake = null; }
  } catch { wake = null; }
}

/* ---------- Follow-along ---------- */
let F = null; // {prog, i, left, total, running, start, done:[], confirm, finished, feel}
let tick = null;

function startSession(prog){
  F = {prog, i:0, confirm:false, finished:false, feel:null, began:Date.now()};
  loadStep(); keepAwake(true); renderFA();
}
function loadStep(){
  const e = EXM[F.prog.ex[F.i]];
  F.total = e.secs; F.left = e.mode === 'timer' ? e.secs : 0; F.running = false; F.timeUp = false;
  clearInterval(tick); tick = null;
}
function toggleTimer(){
  const e = EXM[F.prog.ex[F.i]];
  if (F.running) { F.running = false; clearInterval(tick); tick = null; updateTimer(); return; }
  if (e.mode === 'timer' && F.left <= 0) F.left = F.total;
  F.timeUp = false; F.running = true;
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume && actx.resume(); } catch {}
  tick = setInterval(() => {
    if (e.mode === 'timer') {
      F.left -= 1;
      if (F.left <= 0) { F.left = 0; F.running = false; F.timeUp = true; clearInterval(tick); tick = null; chime(); }
    } else F.left += 1;
    updateTimer();
  }, 1000);
  updateTimer();
}
function resetTimer(){ loadStep(); updateTimer(); }

function timerHTML(e){
  const C = 2 * Math.PI * 52;
  const frac = e.mode === 'timer' ? F.left / F.total : Math.min(1, F.left / F.total);
  const off = C * (1 - frac);
  return `<div class="ring"><svg viewBox="0 0 120 120"><circle class="tr" cx="60" cy="60" r="52"/><circle class="pr" id="ring-pr" cx="60" cy="60" r="52" stroke-dasharray="${C}" stroke-dashoffset="${off}"/></svg><div class="num" id="t-num" aria-live="off">${fmt(F.left)}</div></div>
  <div class="timer-side">
    <span class="${F.timeUp ? 'done-msg' : 'lbl'}" id="t-lbl" aria-live="polite">${F.timeUp ? 'Time! Tap Next when ready.' : e.mode === 'timer' ? (F.running ? 'Keep going…' : 'Timer') : (F.running ? 'Follow the video' : 'Time spent')}</span>
    <button class="btn ${F.running ? '' : 'primary'} small" id="t-go" data-timer>${ico(F.running ? 'pause' : 'play')}${F.running ? 'Pause' : (F.left > 0 && F.left < F.total && e.mode === 'timer') || (e.mode === 'video' && F.left > 0) ? 'Resume' : 'Start timer'}</button>
    ${(F.left !== (e.mode === 'timer' ? F.total : 0)) ? `<button class="btn quiet small" data-reset>${ico('restart')}Restart</button>` : ''}
  </div>`;
}
function updateTimer(){
  const e = EXM[F.prog.ex[F.i]];
  const el = document.getElementById('timer');
  if (el) el.innerHTML = timerHTML(e);
}

function renderFA(){
  if (!F) { overlay.innerHTML = ''; document.body.style.overflow = ''; return; }
  document.body.style.overflow = 'hidden';
  const n = F.prog.ex.length;
  if (F.finished) {
    overlay.innerHTML = `<div class="fa"><div class="fa-body" style="padding-bottom:40px">
      <div class="finish">
        <div class="leaf">${ico('leaf')}</div>
        <h2>Nice work today</h2>
        <p class="muted">You finished ${esc(F.prog.name)}.</p>
        <p style="font-weight:700;margin-top:10px">How did that feel?</p>
        <div class="feel">${[['easy','Easy'],['right','Just right'],['hard','Too hard']].map(([k, l]) => `<button class="btn${F.feel === k ? ' on' : ''}" data-feel="${k}" aria-pressed="${F.feel === k}">${l}</button>`).join('')}</div>
        ${F.feel === 'hard' ? `<div class="tip" style="text-align:left">${ico('shield')}<div><b>Next time</b>Try fewer reps, shorter holds, or the seated version. Rest as long as you need between exercises.</div></div>` : ''}
        ${F.feel === 'easy' ? `<p class="muted">Next time you could add a few more reps, or try another routine afterward.</p>` : ''}
        <button class="btn primary wide" data-close-fa>Done</button>
      </div></div></div>`;
    return;
  }
  const e = EXM[F.prog.ex[F.i]];
  const last = F.i === n - 1;
  overlay.innerHTML = `<div class="fa" role="dialog" aria-modal="true" aria-label="${esc(F.prog.name)}">
    <div class="fa-top"><div class="fa-top-in">
      <span class="count">${F.i + 1} of ${n}</span>
      <button class="btn quiet small" data-end>${ico('close')}End</button>
    </div><div class="bar"><div style="width:${(F.i / n) * 100}%"></div></div></div>
    <div class="fa-body" style="${catVar(e.category)}">
      ${F.confirm ? `<div class="confirm"><b style="font-size:1.1rem">End this routine?</b><span class="muted">What you've done so far still counts.</span><button class="btn primary" data-confirm-end>Yes, end and save</button><button class="btn" data-keep>Keep going</button></div>` : ''}
      <div>
        <span class="tag cat">${ico(CATS[e.category].icon)}${POS[e.position]}</span>
        <h1 class="d-title" style="margin-bottom:4px">${esc(e.name)}</h1>
        <p class="dose" style="margin:0">${esc(e.dose)}</p>
      </div>
      <div>${videoBlock(e)}</div>
      <div class="timer" id="timer">${timerHTML(e)}</div>
      <ol class="steps">${e.steps.map(s => `<li>${esc(s)}</li>`).join('')}</ol>
      <div class="tip">${ico('shield')}<div><b>Safety tip</b>${esc(e.tip)}</div></div>
      ${canSpeak ? `<button class="btn small" data-speak="${e.id}">${ico(speaking === e.id ? 'stopS' : 'speak')}${speaking === e.id ? 'Stop reading' : 'Read aloud'}</button>` : ''}
      <p class="stop-note">Stop and rest if anything hurts or you feel dizzy.</p>
    </div>
    <div class="fa-foot"><div class="fa-foot-in">
      <button class="btn" data-prev ${F.i === 0 ? 'disabled style="opacity:.4"' : ''}>${ico('back')}Back</button>
      <button class="btn primary" data-next>${last ? ico('check') + 'Finish' : 'Next ' + ico('next')}</button>
    </div></div>
  </div>`;
}

function logSession(count){
  const mins = Math.max(1, Math.round((Date.now() - F.began) / 60000));
  S.log.push({date: ymd(new Date()), name: F.prog.name, count, mins, feel: null});
  if (S.log.length > 400) S.log = S.log.slice(-400);
  save(); F.logIdx = S.log.length - 1;
}
function stepTo(i){
  if (canSpeak && speaking) { try { speechSynthesis.cancel(); } catch {} speaking = null; }
  F.i = i; loadStep(); renderFA();
  const fa = overlay.querySelector('.fa'); if (fa) fa.scrollTop = 0;
}
function closeFA(){
  clearInterval(tick); tick = null; F = null; keepAwake(false);
  if (canSpeak) { try { speechSynthesis.cancel(); } catch {} speaking = null; }
  renderFA(); render();
}

/* ---------- Events ---------- */
document.addEventListener('click', ev => {
  const t = ev.target.closest('button, [data-close-sheet]');
  if (!t) return;
  const d = t.dataset;
  if (d.closeSheet !== undefined && (t.tagName === 'BUTTON' || ev.target === t)) { overlay.innerHTML = ''; if (F) renderFA(); return; }
  if (d.tab) return go(d.tab);
  if (d.back !== undefined) { return go(tab); }
  if (d.openProgram) return go(tab, {type:'program', id:d.openProgram});
  if (d.openEx) return go(tab, {type:'exercise', id:d.openEx});
  if (d.start) { const p = getProgram(d.start); if (p) startSession(p); return; }
  if (d.startEx) { const e = EXM[d.startEx]; startSession({id:'single', name:e.name, cat:e.category, ex:[e.id]}); return; }
  if (d.filter) { exFilter = d.filter; return render(); }
  if (t.id === 'seated-switch') { S.seatedOnly = !S.seatedOnly; save(); return render(); }
  if (d.fav) { const i = S.favs.indexOf(d.fav); i < 0 ? S.favs.push(d.fav) : S.favs.splice(i, 1); save(); return render(); }
  if (d.speak) { return speak(EXM[d.speak], t); }
  if (d.act === 'welcomed') { S.welcomed = true; save(); return render(); }
  if (d.tour !== undefined) { S.welcomed = true; save(); return startTour(); }
  if (T) {
    if (d.tourNext !== undefined) return tourStep(T.i + 1);
    if (d.tourBack !== undefined) return tourStep(T.i - 1);
    if (d.tourEnd !== undefined) return endTour();
  }
  if (d.size) { S.size = d.size; save(); applyPrefs(); if (overlay.querySelector('.sheet')) sizeSheet(); return render(); }
  if (d.themeSet) { S.theme = d.themeSet; save(); applyPrefs(); return render(); }
  if (t.id === 'size-btn') return sizeSheet();
  // follow-along
  if (!F) return;
  if (d.timer !== undefined) return toggleTimer();
  if (d.reset !== undefined) return resetTimer();
  if (d.next !== undefined) {
    if (F.i < F.prog.ex.length - 1) return stepTo(F.i + 1);
    clearInterval(tick); tick = null; logSession(F.prog.ex.length); F.finished = true; keepAwake(false); return renderFA();
  }
  if (d.prev !== undefined) { if (F.i > 0) stepTo(F.i - 1); return; }
  if (d.end !== undefined) { F.confirm = true; renderFA(); overlay.querySelector('.fa').scrollTop = 0; return; }
  if (d.keep !== undefined) { F.confirm = false; return renderFA(); }
  if (d.confirmEnd !== undefined) {
    if (F.i > 0 || F.left !== (EXM[F.prog.ex[F.i]].mode === 'timer' ? F.total : 0)) logSession(F.i + (F.timeUp ? 1 : 0) || 1);
    return closeFA();
  }
  if (d.feel) { F.feel = d.feel; if (F.logIdx != null && S.log[F.logIdx]) { S.log[F.logIdx].feel = d.feel; save(); } return renderFA(); }
  if (d.closeFa !== undefined) return closeFA();
});
document.addEventListener('visibilitychange', () => { if (F && !F.finished && document.visibilityState === 'visible') keepAwake(true); });

/* ---------- Tour ---------- */

  {sel:'[data-tab="exercises"]', tab:'exercises', title:'Exercises', text:'Every exercise on its own, each with a video. Tap one to see how. Tap the <b>heart</b> to save your favorites.'},
  {sel:'#seated-switch', tab:'exercises', title:'Only seated', text:'Turn this on to see only the exercises you can do sitting in a chair.'},
  {sel:'[data-tab="week"]', tab:'week', title:'My Week', text:"See what you've done, change the text size and colors, and find help."},
  {sel:null, tab:'today', title:'During a routine', text:'You see one exercise at a time.<ol class="tour-list"><li>Watch the video.</li><li>Tap <b>Start timer</b> and do the exercise.</li><li>Tap <b>Next</b> when you are ready.</li></ol>Tap <b>End</b> anytime. What you did still counts.', pic:'play'},
  {sel:null, tab:'today', title:"You're all set", text:'Check with your doctor before starting a new routine. Stop and rest if anything hurts or you feel dizzy.<br><br>Enjoy moving!', pic:'shield'}
];
let T = null;
const tourEl = document.createElement('div');
tourEl.id = 'tour';
document.body.appendChild(tourEl);

function startTour(){
  if (F) return;
  overlay.innerHTML = '';
  T = {i:0};
  tab = 'today'; view = null; render();
  tourStep(0);
}
function endTour(){
  T = null; tourEl.innerHTML = '';
  document.removeEventListener('keydown', tourKey);
  go('today');
}
function tourKey(e){
  if (!T) return;
  if (e.key === 'Escape') endTour();
  else if (e.key === 'ArrowRight') tourStep(T.i + 1);
  else if (e.key === 'ArrowLeft') tourStep(T.i - 1);
}
function tourStep(i){
  if (i < 0) return;
  if (i >= TOUR.length) return endTour();
  T.i = i;
  const s = TOUR[i];
  if (tab !== s.tab || view) { tab = s.tab; view = null; render(); }
  document.removeEventListener('keydown', tourKey);
  document.addEventListener('keydown', tourKey);
  const target = s.sel ? document.querySelector(s.sel) : null;
  if (target && !target.closest('.tabs, .hdr')) {
    const r = target.getBoundingClientRect();
    window.scrollTo({top: Math.max(0, r.top + window.scrollY - (window.innerHeight - r.height) / 2), behavior:'instant'});
  } else window.scrollTo(0, 0);
  requestAnimationFrame(() => drawTour(target));
}
function holeRect(target){
  const vh = window.innerHeight, vw = window.innerWidth, pad = 8, r = target.getBoundingClientRect();
  const top = Math.max(4, r.top - pad), left = Math.max(4, r.left - pad);
  return {top, left, w: Math.min(vw - 4, r.right + pad) - left, h: Math.min(vh - 4, r.bottom + pad) - top};
}
function placeTour(target){
  const card = tourEl.querySelector('.tour-card'), holeEl = tourEl.querySelector('.tour-hole');
  if (!card || !target) return;
  const vh = window.innerHeight, gap = 12, margin = 10;
  let hr = holeRect(target);
  const ch = card.offsetHeight;
  const fitsBelow = hr.top + hr.h + gap + ch <= vh - margin;
  const fitsAbove = hr.top - gap - ch >= margin;
  const fixed = target.closest('.tabs, .hdr');
  if (!fitsBelow && !fitsAbove && !fixed) {
    // Bring the target's top up under the header, then try again below it.
    const hdr = Math.max(0, document.querySelector('.hdr').getBoundingClientRect().bottom);
    window.scrollTo({top: Math.max(0, target.getBoundingClientRect().top + window.scrollY - hdr - 12), behavior:'instant'});
    hr = holeRect(target);
  }
  Object.assign(holeEl.style, {top: hr.top + 'px', left: hr.left + 'px', width: hr.w + 'px', height: hr.h + 'px'});
  card.style.bottom = ''; card.style.maxHeight = '';
  let top;
  if (hr.top + hr.h + gap + ch <= vh - margin) top = hr.top + hr.h + gap;          // below the target
  else if (hr.top - gap - ch >= margin) top = hr.top - gap - ch;                    // above the target
  else {                                                                             // tall target: sit over its lower part
    const maxH = Math.min(ch, Math.max(260, vh * .6));
    card.style.maxHeight = maxH + 'px';
    top = vh - margin - maxH;
  }
  card.style.top = Math.max(margin, Math.min(top, vh - margin - Math.min(ch, vh - 2 * margin))) + 'px';
  card.style.visibility = '';
}
function drawTour(target){
  if (!T) return;
  const s = TOUR[T.i], n = TOUR.length, last = T.i === n - 1;
  const centered = !target;
  const hole = target ? '<div class="tour-hole"></div>' : '';
  tourEl.innerHTML = `<div class="tour-layer${centered ? ' dim' : ''}">${hole}
    <div class="tour-card${centered ? ' center' : ''}" style="${centered ? '' : 'visibility:hidden;top:0'}" role="dialog" aria-modal="true" aria-labelledby="tour-t" aria-describedby="tour-x">
      ${s.pic ? `<div class="tour-pic">${ico(s.pic)}</div>` : ''}
      <div class="tour-dots" aria-label="Step ${T.i + 1} of ${n}">${TOUR.map((_, k) => `<i class="${k === T.i ? 'on' : k < T.i ? 'past' : ''}"></i>`).join('')}</div>
      <h2 id="tour-t">${s.title}</h2>
      <div id="tour-x" class="tour-text">${s.text}</div>
      <div class="tour-foot">
        <div class="tour-btns">
          ${T.i > 0 ? `<button class="btn small" data-tour-back>${ico('back')}Back</button>` : `<button class="btn small quiet" data-tour-end>Close</button>`}
          <button class="btn primary small" data-tour-next id="tour-next">${last ? 'Start using Willow' : 'Next ' + ico('next')}</button>
        </div>
        ${T.i > 0 && !last ? `<button class="tour-skip" data-tour-end>Close the tour</button>` : ''}
      </div>
    </div></div>`;
  placeTour(target);
  const nb = document.getElementById('tour-next'); if (nb) nb.focus({preventScroll:true});
}
window.addEventListener('resize', () => { if (T) { const s = TOUR[T.i]; drawTour(s.sel ? document.querySelector(s.sel) : null); } });

// First visit: offer the tour on the welcome card (no auto-start).

applyPrefs();
render();
})();
</script>

</body>
</html>
