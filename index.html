<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#36613f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Willow">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest?v=7">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=7">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=7">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=7">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<script>window.WILLOW_EMBED = true;</script>
<title>Willow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lexend:wght@500;600&display=swap">
</head>
<body>
<style>
/* Layout: one-column phone app. Sticky header (logo, colors, text size, settings), scrolling page that ends in a
   Settings / Help / Tour / Feedback footer, fixed four-tab bar, full-screen follow-along with a fixed action footer.
   Natural palette: moss accent on pale sage-stone (light) or deep forest (dark); category hues used only as small markers. */
:root{
  --bg:#f1f3ec; --surface:#fbfcf8; --sunk:#e3e8db; --line:#d1d8c8; --edge:#7f8b7a;
  --ink:#1c2620; --ink-2:#47544a; --ink-3:#5b665e;
  --accent:#36613f; --accent-ink:#ffffff; --accent-soft:#dbe7d7;
  --c-chair:#36613f; --c-balance:#2d6580; --c-taichi:#765610; --c-stretch:#954629; --c-mobility:#57568a;
  --tip-bg:#f4ecd6; --tip-ink:#5a4208; --warn-bg:#f7e3dc; --warn-ink:#7a2a14;
  --scrim:rgba(20,28,22,.45);
  --display:'Lexend','Avenir Next','Segoe UI',system-ui,sans-serif;
  --body:'Atkinson Hyperlegible','Verdana',system-ui,sans-serif;
  --r:18px; --gut:16px;
  font-size:18px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#121813; --surface:#1a221c; --sunk:#26322a; --line:#324035; --edge:#7d8c80;
    --ink:#e7ede4; --ink-2:#b8c3b9; --ink-3:#a0aca2;
    --accent:#93c59b; --accent-ink:#0f1a12; --accent-soft:#25392b;
    --c-chair:#93c59b; --c-balance:#8cc3de; --c-taichi:#dcbc6b; --c-stretch:#e9a083; --c-mobility:#b4b3e2;
    --tip-bg:#2e2a1c; --tip-ink:#e8d39b; --warn-bg:#3a221b; --warn-ink:#f2b8a4;
    --scrim:rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121813; --surface:#1a221c; --sunk:#26322a; --line:#324035; --edge:#7d8c80;
  --ink:#e7ede4; --ink-2:#b8c3b9; --ink-3:#a0aca2;
  --accent:#93c59b; --accent-ink:#0f1a12; --accent-soft:#25392b;
  --c-chair:#93c59b; --c-balance:#8cc3de; --c-taichi:#dcbc6b; --c-stretch:#e9a083; --c-mobility:#b4b3e2;
  --tip-bg:#2e2a1c; --tip-ink:#e8d39b; --warn-bg:#3a221b; --warn-ink:#f2b8a4;
  --scrim:rgba(0,0,0,.6);
}
/* Text sizes: standard 16 · medium 18 (default) · large 21 · extra large 24 · largest 27 */
:root[data-size="standard"]{font-size:16px}
:root[data-size="large"]{font-size:21px}
:root[data-size="xlarge"]{font-size:24px}
:root[data-size="largest"]{font-size:27px}

*{box-sizing:border-box}
html{height:100%}
body{min-height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1rem;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:10px}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:600;text-wrap:balance;line-height:1.15}
h1:focus{outline:none}
p{margin:0}
svg{flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* Shell */
.hdr{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.hdr-in{max-width:560px;margin:0 auto;padding:8px 10px 8px var(--gut);display:flex;align-items:center;gap:6px;min-height:64px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:600;font-size:min(1.3rem,26px);color:var(--ink);min-width:0;margin-right:auto}
.brand img{width:34px;height:34px;border-radius:9px;flex:none}
.hbtn{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;white-space:nowrap;color:var(--ink);background:var(--sunk);flex:none;font-family:var(--display);font-weight:600;font-size:17px}
.hbtn svg{width:24px;height:24px}
main{max-width:560px;margin:0 auto;padding-inline:var(--gut);padding-block:18px calc(110px + env(safe-area-inset-bottom,0px))}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(8px + env(safe-area-inset-bottom,0px))}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;min-height:64px;border-radius:14px;color:var(--ink-2);font-size:clamp(14px,.82rem,17px);font-weight:700;min-width:0;text-align:center;line-height:1.15}
.tab svg{width:28px;height:28px}
.tab.on{color:var(--accent);background:var(--accent-soft)}

/* Type + common */
.page-h{font-size:min(1.75rem,38px);margin-bottom:6px}
.lede{color:var(--ink-2);margin-bottom:18px}
.sec-h{font-size:1.2rem;margin:30px 0 12px}
.stack{display:flex;flex-direction:column;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:60px;padding:12px 20px;border-radius:16px;font-family:var(--display);font-weight:600;font-size:1.1rem;background:var(--surface);color:var(--ink);border:2px solid var(--edge);text-decoration:none;text-align:center;min-width:0}
.btn svg{width:1.4rem;height:1.4rem}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.wide{width:100%}
.btn.small{min-height:54px;font-size:1rem;padding:10px 14px}
.btn.link{border:0;background:none;color:var(--accent);min-height:52px;padding:8px 6px;text-decoration:underline;text-underline-offset:4px}
.btn[disabled]{opacity:.45}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;font-weight:700;padding:4px 12px;border-radius:999px;background:var(--sunk);color:var(--ink-2)}
.tag.cat{color:var(--cc);background:color-mix(in srgb,var(--cc) 14%,var(--surface))}
.tag svg{width:1rem;height:1rem}
.muted{color:var(--ink-2)}
.tip{display:flex;gap:10px;background:var(--tip-bg);color:var(--tip-ink);border-radius:14px;padding:14px 16px;font-size:.95rem}
.tip.warn{background:var(--warn-bg);color:var(--warn-ink)}
.tip svg{width:1.3rem;height:1.3rem;margin-top:2px}
.tip b{display:block}
.tip .btn{margin-top:10px}
.prog-meta{display:flex;flex-wrap:wrap;gap:8px}
.eyebrow{font-size:.85rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.needs{display:flex;gap:8px;align-items:flex-start;color:var(--ink-2);font-size:.95rem}
.needs svg{width:1.2rem;height:1.2rem;margin-top:2px}

/* Today */
.hello{font-size:min(1.9rem,40px);margin-bottom:4px}
.date{color:var(--ink-2);margin-bottom:18px}
.today-card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.today-card::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:var(--cc)}
.today-card h2{font-size:min(1.6rem,36px)}
.today-card .sess{font-family:var(--display);font-weight:600;color:var(--ink-2);font-size:1.1rem;margin-top:-6px}
.ex-mini{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;color:var(--ink-2)}
.ex-mini li{display:flex;gap:10px;align-items:baseline}
.ex-mini li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--cc);flex:none;transform:translateY(-2px)}
.banner{display:flex;flex-direction:column;gap:10px;background:var(--accent-soft);border-radius:18px;padding:16px;margin-bottom:18px}
.banner .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.85rem;font-weight:700;color:var(--ink-3);min-width:0}
.wd i{width:100%;max-width:44px;aspect-ratio:1;border-radius:50%;background:var(--sunk);display:grid;place-items:center;color:var(--accent-ink)}
.wd i svg{width:60%;height:60%}
.wd.hit i{background:var(--accent)}
.wd.now{color:var(--ink)}
.wd.now i{box-shadow:0 0 0 3px var(--ink-2)}
.week-note{margin-top:12px;color:var(--ink-2)}
.mix{display:grid;gap:10px;margin-top:16px}
.mix-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px}
.mix-row b{font-weight:700}
.pips{display:flex;gap:6px}
.pips i{width:22px;height:22px;border-radius:50%;border:2px solid var(--edge)}
.pips i.on{background:var(--accent);border-color:var(--accent)}
.mix-row .s{grid-column:1/-1;color:var(--ink-2);font-size:.9rem;margin-top:-6px}

/* Program cards + list rows */
.p-card{display:flex;flex-direction:column;gap:10px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-left:8px solid var(--cc);border-radius:var(--r);padding:16px 18px}
.p-card h3{font-size:1.25rem}
.p-card .go{display:flex;align-items:center;gap:6px;color:var(--accent);font-family:var(--display);font-weight:600}
.p-card .go svg{width:1.2rem;height:1.2rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.chip{min-height:52px;padding:0 16px;border-radius:999px;background:var(--surface);border:2px solid var(--edge);font-weight:700;font-size:.95rem;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:64px;padding:8px 0;width:100%;text-align:left;font-weight:700}
.toggle-row .d{display:block;font-weight:400;color:var(--ink-2);font-size:.9rem}
.switch{min-width:84px;height:44px;border-radius:999px;background:var(--sunk);border:2px solid var(--edge);position:relative;flex:none;display:flex;align-items:center;justify-content:flex-end;padding:0 12px;font-size:.85rem;font-weight:700;color:var(--ink-2)}
.switch::before{content:"";position:absolute;top:4px;left:4px;width:32px;height:32px;border-radius:50%;background:var(--edge);transition:transform .2s}
.switch.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);justify-content:flex-start}
.switch.on::before{background:var(--accent-ink);transform:translateX(36px)}
.ex-row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 4px;border-bottom:1px solid var(--line);min-height:76px}
.ex-ico{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;color:var(--cc);background:color-mix(in srgb,var(--cc) 14%,var(--surface));flex:none}
.ex-ico svg{width:30px;height:30px}
.ex-row .t{font-weight:700;font-size:1.05rem;line-height:1.25}
.ex-row .s{color:var(--ink-2);font-size:.92rem}
.ex-row .txt{flex:1;min-width:0}
.ex-row .fav{color:var(--c-stretch)}
.ex-row .fav svg{width:1.2rem;height:1.2rem}
.chev{color:var(--ink-3);width:1.3rem;height:1.3rem}
.empty{text-align:center;padding:30px 10px;color:var(--ink-2)}
.sess-card{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:10px}
.sess-card.next{border:2px solid var(--accent)}
.sess-card h3{font-size:1.15rem}
.sess-card ol{margin:0;padding-left:1.4rem;color:var(--ink-2);display:flex;flex-direction:column;gap:4px}

/* Detail pages */
.back{display:inline-flex;align-items:center;gap:6px;min-height:52px;font-family:var(--display);font-weight:600;color:var(--accent);margin:-6px 0 6px -6px;padding:0 8px}
.back svg{width:1.3rem;height:1.3rem}
.d-title{font-size:min(1.8rem,38px);margin:6px 0 10px}
.d-tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.dose{font-family:var(--display);font-weight:600;font-size:1.3rem;margin-bottom:14px}
.video{border-radius:16px;overflow:hidden;background:#000;aspect-ratio:16/9;max-width:100%;width:100%}
.video iframe{width:100%;height:100%;border:0;display:block}
.vid-src{font-size:.9rem;color:var(--ink-2);margin-top:8px}
.vid-alt{margin-top:8px}
.watch{display:flex;align-items:center;gap:14px;width:100%;text-decoration:none;color:var(--ink);background:var(--surface);border:2px solid var(--edge);border-radius:16px;padding:14px 16px;min-height:76px}
.watch .play{width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.watch .play svg{width:26px;height:26px;margin-left:3px}
.watch .t{font-family:var(--display);font-weight:600;font-size:1.1rem}
.watch .s{font-size:.9rem;color:var(--ink-2)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;counter-reset:s}
.steps li{display:flex;gap:14px;align-items:flex-start;font-size:1.05rem}
.steps li::before{counter-increment:s;content:counter(s);width:2rem;height:2rem;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-family:var(--display);font-weight:600;display:grid;place-items:center;flex:none;font-size:.95rem}
.act-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.easier{display:flex;gap:10px;border-left:4px solid var(--accent);padding:6px 0 6px 12px;color:var(--ink-2)}

/* Page footer: the same four helpers at the end of every page */
.pfoot{margin-top:40px;padding-top:18px;border-top:1px solid var(--line)}
.pfoot h2{font-size:1rem;color:var(--ink-2);font-family:var(--body);font-weight:700;margin-bottom:10px}
.pfoot-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pfoot .btn{flex-direction:column;gap:4px;min-height:84px;padding:10px 8px;font-size:1rem}
.pfoot .btn svg{width:1.6rem;height:1.6rem}
.pfoot .note{font-size:.85rem;color:var(--ink-2);margin-top:14px;text-align:center}

/* Settings / help / feedback */
.opt-list{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:14px;min-height:64px;padding:10px 16px;border-radius:14px;border:2px solid var(--edge);text-align:left;width:100%;background:var(--surface)}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt .sample{font-family:var(--display);font-weight:600;width:3.4rem;flex:none;text-align:center;line-height:1}
.opt .lbl{display:flex;flex-direction:column;min-width:0;flex:1}
.opt .lbl b{font-weight:700}
.opt .lbl span{font-size:.88rem;color:var(--ink-2)}
.opt .chk{width:1.5rem;height:1.5rem;color:var(--accent)}
.swatch{width:3.4rem;height:2.6rem;border-radius:10px;flex:none;border:2px solid var(--edge);display:grid;place-items:center;font-family:var(--display);font-weight:600}
.set-block{display:flex;flex-direction:column;gap:10px}
.set-block+.set-block{margin-top:28px}
.set-block h2{font-size:1.2rem}
.set-block .hint{color:var(--ink-2);font-size:.92rem;margin-top:-4px}
.help-sec{display:flex;flex-direction:column;gap:8px}
.help-sec+.help-sec{margin-top:24px}
.help-sec h2{font-size:1.2rem}
.help-sec ol,.help-sec ul{margin:0;padding-left:1.3rem;display:flex;flex-direction:column;gap:6px}
textarea.field,input.field,select.field{width:100%;background:var(--surface);border:2px solid var(--edge);border-radius:14px;padding:14px;font-size:1.05rem}
textarea.field{min-height:160px;resize:vertical;line-height:1.45}
textarea.field:focus,input.field:focus,select.field:focus{outline:3px solid var(--accent);outline-offset:1px}
label.lbl{display:block;font-weight:700;margin-bottom:8px}
.status{color:var(--accent);font-weight:700}
.inline-confirm{display:flex;flex-direction:column;gap:10px;border:2px solid var(--warn-ink);border-radius:16px;padding:14px}

/* My Week */
.log-item{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.date-chip{width:58px;flex:none;border-radius:14px;background:var(--sunk);display:flex;flex-direction:column;align-items:center;padding:6px 0}
.date-chip span{font-size:.8rem;font-weight:700;color:var(--ink-2)}
.date-chip b{font-family:var(--display);font-size:1.5rem;line-height:1.1}
.log-item .t{font-weight:700}
.log-item .s{color:var(--ink-2);font-size:.92rem}
.minutes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}

/* Follow-along */
.fa{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px)}
.fa-top{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line)}
.fa-top-in{max-width:560px;margin:0 auto;padding:8px var(--gut);display:flex;align-items:center;gap:12px;min-height:64px}
.fa-top .count{font-family:var(--display);font-weight:600;font-size:min(1.05rem,21px);flex:1;min-width:0}
.bar{height:8px;background:var(--sunk)}
.bar>div{height:100%;background:var(--accent);transition:width .3s}
.fa-body{max-width:560px;margin:0 auto;padding-inline:var(--gut);padding-block:16px calc(150px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.fa-foot{position:fixed;left:0;right:0;bottom:0;z-index:3;background:var(--surface);border-top:1px solid var(--line);padding:10px var(--gut) calc(12px + env(safe-area-inset-bottom,0px))}
.fa-foot-in{max-width:528px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.8fr);gap:10px}
.fa-foot-in.one{grid-template-columns:minmax(0,1fr)}
.fa-foot .btn{min-height:64px;padding:10px 12px;font-size:min(1.1rem,22px)}
.fa-top .btn{font-size:min(1rem,20px)}
.timer{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:center;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px}
.ring{position:relative;width:min(7rem,140px);height:min(7rem,140px);min-width:110px;min-height:110px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .tr{fill:none;stroke:var(--sunk);stroke-width:10}
.ring .pr{fill:none;stroke:var(--accent);stroke-width:10;stroke-linecap:round}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:min(1.9rem,40px);font-variant-numeric:tabular-nums}
.timer-side{display:flex;flex-direction:column;gap:6px;flex:1 1 9rem;min-width:0}
.timer-side .lbl{font-weight:700;font-size:1.1rem}
.timer-side .sub{color:var(--ink-2)}
.timer-side .done-msg{font-weight:700;color:var(--accent);font-size:1.1rem}
.reps-box{display:flex;flex-direction:column;gap:6px;background:var(--accent-soft);border-radius:20px;padding:18px}
.reps-box>b{font-family:var(--display);font-size:1.5rem;font-weight:600}
.stop-note{font-size:.95rem;color:var(--ink-2);text-align:center}
.confirm{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:2px solid var(--edge);border-radius:18px;padding:16px}
.center-page{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;padding-top:16px}
.center-page .leaf{width:96px;height:96px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.center-page .leaf svg{width:56px;height:56px}
.center-page h2{font-size:2rem}
.feel{display:grid;grid-template-columns:1fr;gap:10px;width:100%}
.feel .btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.ready-list{text-align:left;width:100%;display:flex;flex-direction:column;gap:10px}

/* Sheet (text size) */
.sheet-wrap{position:fixed;inset:0;z-index:60;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:24px 24px 0 0;padding:20px var(--gut) calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.sheet h2{font-size:1.35rem}

/* Tour */
.tour-layer{position:fixed;inset:0;z-index:80}
.tour-layer.dim{background:var(--scrim)}
.tour-hole{position:fixed;border-radius:18px;box-shadow:0 0 0 9999px var(--scrim),0 0 0 4px var(--accent);pointer-events:none}
.tour-card{position:fixed;left:var(--gut);right:var(--gut);max-width:528px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px 20px 0;box-shadow:0 12px 40px rgba(0,0,0,.28);display:flex;flex-direction:column;gap:12px;overflow-y:auto;max-height:calc(100% - 20px)}
.tour-card.center{top:50%;transform:translateY(-50%);max-height:calc(100% - 32px)}
.tour-card h2{font-size:1.4rem}
.tour-text{font-size:1.05rem}
.tour-list{margin:10px 0;padding-left:1.4rem;display:flex;flex-direction:column;gap:6px}
.tour-pic{width:72px;height:72px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.tour-pic svg{width:40px;height:40px}
.tour-dots{display:flex;gap:6px;flex-wrap:wrap}
.tour-dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.tour-dots i.past{background:var(--edge)}
.tour-dots i.on{background:var(--accent);width:24px;border-radius:5px}
.tour-foot{position:sticky;bottom:0;margin-top:auto;background:var(--surface);padding-block:8px 16px;display:flex;flex-direction:column;align-items:stretch;gap:4px}
.tour-btns{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:10px}
.btn.off{opacity:.45}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;max-width:calc(100% - 32px);text-align:center}
</style>

/* ---------- Speech, chime, wake lock ---------- */
const canSpeak = 'speechSynthesis' in window;
let speaking = null;
function say(text, id){
  if (!canSpeak) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.rate = .88;
    u.onend = u.onerror = () => { speaking = null; refreshSpeakBtns(); }; speaking = id || 'x'; speechSynthesis.speak(u); refreshSpeakBtns(); } catch { speaking = null; }
}
function stopSpeak(){ if (canSpeak) { try { speechSynthesis.cancel(); } catch {} } speaking = null; refreshSpeakBtns(); }
const exText = e => `${e.name}. ${e.dose}. ${e.steps.map((s, i) => `Step ${i+1}. ${s}`).join(' ')} Safety tip. ${e.tip}`;
function toggleRead(e){ if (speaking === e.id) stopSpeak(); else say(exText(e), e.id); }
function refreshSpeakBtns(){ document.querySelectorAll('[data-speak]').forEach(b => { const on = speaking === b.dataset.speak;
  b.innerHTML = `${ico(on ? 'stopS' : 'speak')}${on ? 'Stop reading' : 'Read aloud'}`; }); }
let actx = null;
function chime(){
  if (S.sound) try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    [523.25, 659.25, 783.99].forEach((f, i) => { const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + i * .18;
      o.type = 'sine'; o.frequency.value = f; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.3, t + .03); g.gain.exponentialRampToValueAtTime(.0001, t + .7);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + .75); });
  } catch {}
  try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch {}
}
function unlockAudio(){ try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume && actx.resume(); } catch {} }
let wake = null;
async function keepAwake(on){ try { if (on && S.wake && 'wakeLock' in navigator) wake = await navigator.wakeLock.request('screen'); else if (!on && wake) { await wake.release(); wake = null; } } catch { wake = null; } }

/* ---------- Navigation (works with the phone's Back gesture) ---------- */
// A view is {tab, page?, id?}. Pages: program, exercise, settings, help, feedback, walk
let V = {tab:'today'};
let F = null;            // the routine in progress
let T = null;            // tour
const main = document.getElementById('main'), tabsEl = document.getElementById('tabs'), overlay = document.getElementById('overlay'), tourEl = document.getElementById('tour');
const TABS = [['today','Today','today'],['programs','Programs','programs'],['exercises','Exercises','exercises'],['week','My Week','week']];
let ignorePop = 0;
function hpush(state){ try { history.pushState(state, ''); } catch {} }
function go(view, opts = {}){
  stopSpeak();
  V = view;
  if (!opts.noPush) hpush({v: view});
  render({focus: true, top: !opts.keepScroll});
}
function goBack(){ try { history.back(); } catch { go({tab: V.tab}); } }
window.addEventListener('popstate', ev => {
  if (ignorePop) { ignorePop--; return; }
  if (T) { endTour(true); return; }
  if (overlay.querySelector('.sheet-wrap')) { closeSheet(true); return; }
  if (F) { // Back gesture during a routine: ask first instead of leaving
    hpush({fa: true});
    if (F.phase === 'finished') { closeFA(true); return; }
    F.confirm = true; renderFA(); return;
  }
  const st = ev.state;
  V = (st && st.v) || {tab:'today'};
  stopSpeak(); render({focus: true, top: true});
});
try { history.replaceState({v: V}, ''); } catch {}

function renderTabs(){ tabsEl.innerHTML = TABS.map(([k, l, ic]) => `<button class="tab${V.tab === k && !V.page ? ' on' : V.tab === k ? ' on' : ''}" data-tab="${k}" aria-current="${V.tab === k ? 'page' : 'false'}">${ico(ic)}${l}</button>`).join(''); }
function render(o = {}){
  renderTabs();
  const page = V.page;
  let html;
  if (page === 'program') html = programView(PM[V.id] || myFavs());
  else if (page === 'exercise') html = exerciseView(EXM[V.id]);
  else if (page === 'settings') html = settingsView();
  else if (page === 'help') html = helpView();
  else if (page === 'feedback') html = feedbackView();
  else if (page === 'walk') html = walkView();
  else html = ({today: todayView, programs: programsView, exercises: exercisesView, week: weekView})[V.tab]();
  main.innerHTML = html + pageFoot();
  if (o.top) window.scrollTo(0, 0);
  if (o.focus) { const h = main.querySelector('h1'); if (h) { h.setAttribute('tabindex', '-1'); try { h.focus({preventScroll: true}); } catch {} } }
  if (page === 'help' && V.id) { const el = document.getElementById(V.id); if (el) el.scrollIntoView(); }
}

/* ---------- Follow-along ---------- */
// F = {prog, sess, ex[], i, phase:'ready'|'ex'|'rest'|'finished', began, t:{...timer}, confirm, feel, logIdx}
let tick = null;
function startSession(prog, sessIdx, resumeAt){
  if (!prog) return;
  const s = prog.sessions[sessIdx] || prog.sessions[0];
  unlockAudio();
  F = {prog, sess: sessIdx, sessName: s.name, ex: s.ex, i: resumeAt || 0, phase: resumeAt ? 'ex' : 'ready', began: Date.now(), confirm: false};
  if (prog.id !== 'mine' && prog.id !== 'single') { S.active = {prog: prog.id, sess: sessIdx, i: F.i, date: todayKey()}; save(); }
  hpush({fa: true});
  keepAwake(true); loadEx(); renderFA();
}
function saveActive(){ if (S.active && F) { S.active.i = F.i; save(); } }
function loadEx(){
  clearInterval(tick); tick = null;
  const id = F.ex[F.i], h = HOW[id];
  F.t = {kind: h.kind, round: 0, rounds: h.kind === 'hold' ? h.rounds : 1, total: h.kind === 'hold' ? h.hold : h.kind === 'time' ? h.secs : 0,
         state: 'idle', endAt: 0, left: 0, sides: !!h.sides};
  F.t.left = F.t.total;
}
function restLoad(){ clearInterval(tick); tick = null; F.t = {kind:'rest', round:0, rounds:1, total:S.rest, state:'running', endAt: Date.now() + S.rest * 1000, left: S.rest}; startTick(); }
function startTick(){ clearInterval(tick); tick = setInterval(onTick, 250); }
function onTick(){
  const t = F && F.t; if (!t || t.state !== 'running') return;
  const left = Math.max(0, Math.ceil((t.endAt - Date.now()) / 1000));
  if (left !== t.left) { t.left = left; updateTimer(); }
  if (left <= 0) {
    clearInterval(tick); tick = null; chime();
    if (t.kind === 'rest') { t.state = 'done'; renderFA(); return; }
    t.round++;
    t.state = t.round >= t.rounds ? 'done' : 'between';
    if (S.autoRead && canSpeak) say(t.state === 'done' ? 'Time is up.' : t.sides ? 'Switch sides.' : 'Rest a moment, then go again.');
    renderFA();
  }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { if (F && F.phase !== 'finished') keepAwake(true); onTick(); } });
function timerStart(){ const t = F.t; unlockAudio();
  if (t.state === 'paused') { t.endAt = Date.now() + t.left * 1000; }
  else { t.left = t.total; t.endAt = Date.now() + t.total * 1000; }
  t.state = 'running'; startTick(); renderFA(); }
function timerPause(){ const t = F.t; t.left = Math.max(0, Math.ceil((t.endAt - Date.now()) / 1000)); t.state = 'paused'; clearInterval(tick); tick = null; renderFA(); }
function timerReset(){ loadEx(); renderFA(); }

function ringHTML(t){
  const C = 2 * Math.PI * 52, frac = t.total ? t.left / t.total : 0;
  return `<div class="ring"><svg viewBox="0 0 120 120"><circle class="tr" cx="60" cy="60" r="52"/><circle class="pr" id="ring-pr" cx="60" cy="60" r="52" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - frac)}"/></svg><div class="num" id="t-num">${fmt(t.left)}</div></div>`;
}
function updateTimer(){
  const t = F.t, n = document.getElementById('t-num'), pr = document.getElementById('ring-pr');
  if (n) n.textContent = fmt(t.left);
  if (pr) { const C = 2 * Math.PI * 52; pr.setAttribute('stroke-dashoffset', C * (1 - (t.total ? t.left / t.total : 0))); }
}
function holdLabel(t){
  if (t.sides && t.rounds === 2) return t.round === 0 ? 'First side' : 'Other side';
  return t.rounds > 1 ? `Hold ${Math.min(t.round + 1, t.rounds)} of ${t.rounds}` : 'Timer';
}
function exBody(e){
  const t = F.t;
  let action = '';
  if (t.kind === 'reps') action = `<div class="reps-box"><span class="muted">Do</span><b>${esc(e.dose)}</b><span class="muted">Go at your own pace. Tap <b>I'm done</b> when you've finished.</span></div>`;
  else if (t.kind === 'video') action = `<div class="reps-box"><b>Follow the video</b><span class="muted">Do as much as feels good. Tap <b>Next</b> when you're finished.</span></div>`;
  else action = `<div class="timer" id="timer">${ringHTML(t)}<div class="timer-side">
      <span class="${t.state === 'done' ? 'done-msg' : 'lbl'}" aria-live="polite">${t.state === 'done' ? 'Time is up. Nicely done.' : t.state === 'between' ? (t.sides ? 'Now switch sides.' : 'Rest a moment, then go again.') : t.kind === 'hold' ? holdLabel(t) : 'Timer'}</span>
      <span class="sub">${t.kind === 'hold' ? `Hold for ${t.total} seconds${t.rounds > 1 ? (t.sides ? ', each side' : `, ${t.rounds} times`) : ''}` : `${fmt(t.total)} in all`}</span>
      ${t.state !== 'idle' && t.state !== 'done' ? `<button class="btn link" data-act="t-reset">${ico('restart')}Start over</button>` : ''}
    </div></div>`;
  return `<div><span class="tag cat" style="${catVar(e.category)}">${ico(CATS[e.category].icon)}${POS[e.position]}</span>
      <h1 class="d-title" style="margin-bottom:4px">${esc(e.name)}</h1><p class="dose" style="margin:0">${esc(e.dose)}</p></div>
    ${action}
    <div>${videoBlock(e)}</div>
    <h2 style="font-size:1.2rem">How to do it</h2>
    <ol class="steps">${e.steps.map(s => `<li>${esc(s)}</li>`).join('')}</ol>
    ${EASIER[e.id] ? `<p class="easier"><span><b>Easier version:</b> ${esc(EASIER[e.id])}</span></p>` : ''}
    <div class="tip">${ico('shield')}<div><b>Safety tip</b>${esc(e.tip)}</div></div>
    ${canSpeak ? `<button class="btn small" data-speak="${e.id}">${ico(speaking === e.id ? 'stopS' : 'speak')}${speaking === e.id ? 'Stop reading' : 'Read aloud'}</button>` : ''}
    <p class="stop-note">Stop and rest if anything hurts or you feel dizzy.</p>`;
}
function primaryFor(){
  const t = F.t, last = F.i === F.ex.length - 1, nextLbl = last ? `${ico('check')}Finish` : `Next ${ico('next')}`;
  if (t.kind === 'reps') return `<button class="btn primary" data-act="next">${last ? ico('check') + 'Finish' : `I'm done ${ico('next')}`}</button>`;
  if (t.kind === 'video') return `<button class="btn primary" data-act="next">${nextLbl}</button>`;
  if (t.state === 'idle') return `<button class="btn primary" data-act="t-start">${ico('play')}Start timer</button>`;
  if (t.state === 'running') return `<button class="btn primary" data-act="t-pause">${ico('pause')}Pause</button>`;
  if (t.state === 'paused') return `<button class="btn primary" data-act="t-start">${ico('play')}Keep going</button>`;
  if (t.state === 'between') return `<button class="btn primary" data-act="t-start">${ico('play')}${t.sides ? 'Start other side' : 'Go again'}</button>`;
  return `<button class="btn primary" data-act="next">${nextLbl}</button>`;
}
function renderFA(){
  if (!F) { overlay.innerHTML = ''; document.body.style.overflow = ''; return; }
  document.body.style.overflow = 'hidden';
  const n = F.ex.length;
  let top = '', body = '', foot = '';
  const confirm = F.confirm ? `<div class="confirm" role="alertdialog" aria-labelledby="cf-h"><b id="cf-h" style="font-size:1.1rem">End this routine?</b><span class="muted">What you've done so far still counts. You can pick up later today.</span><button class="btn primary" data-act="keep">Keep going</button><button class="btn" data-act="confirm-end">End for now</button></div>` : '';
  if (F.phase === 'ready') {
    const needs = needsOf(F.ex), stand = standsUp(F.ex);
    top = `<span class="count">${esc(F.prog.name)}</span><button class="btn small" data-act="end-now">${ico('close')}Close</button>`;
    body = `<div class="center-page"><div class="leaf">${ico('leaf')}</div><h1 style="font-size:1.8rem">Get ready</h1>
      <p class="muted">${esc(F.sessName)} · ${n} exercise${n === 1 ? '' : 's'} · about ${sessMins(F.ex)} min</p>
      <div class="ready-list">
        ${needs.length ? `<div class="card"><b>You'll need</b><ul style="margin:8px 0 0;padding-left:1.3rem">${needs.map(k => `<li>${esc(NEEDS[k])}</li>`).join('')}</ul></div>` : ''}
        ${stand ? `<div class="tip">${ico('shield')}<div><b>For the standing moves</b>Stand by a counter or sturdy chair you can hold. It's good to have someone nearby.</div></div>` : ''}
        <div class="tip">${ico('shield')}<div><b>Listen to your body</b>Stop if anything hurts or you feel dizzy. Call 911 for chest pain or trouble breathing.</div></div>
      </div></div>`;
    foot = `<div class="fa-foot-in one"><button class="btn primary" data-act="begin">${ico('play')}Let's begin</button></div>`;
  } else if (F.phase === 'finished') {
    const nextS = F.prog.sessions && F.prog.id !== 'mine' && F.prog.id !== 'single' ? F.prog.sessions[nextIdx(F.prog)] : null;
    top = `<span class="count">All done</span>`;
    body = `<div class="center-page"><div class="leaf">${ico('leaf')}</div><h1>Nice work today</h1>
      <p class="muted">You finished ${esc(F.prog.name)}${F.sessName && F.prog.id !== 'single' ? ': ' + esc(F.sessName) : ''}.</p>
      ${nextS && F.prog.sessions.length > 1 ? `<p>Next time: <b>${esc(nextS.name)}</b></p>` : ''}
      <p style="font-weight:700;margin-top:10px">How did that feel?</p>
      <div class="feel">${[['easy','Easy'],['right','Just right'],['hard','Too hard']].map(([k, l]) => `<button class="btn" data-feel="${k}" aria-pressed="${F.feel === k}">${l}</button>`).join('')}</div>
      ${F.feel === 'hard' ? `<div class="tip" style="text-align:left">${ico('leaf')}<div><b>Next time</b>Try the easier versions, do fewer reps, or tap <b>Something gentler</b> on Today. Rest as long as you need.</div></div>` : ''}
      ${F.feel === 'easy' ? `<p class="muted">Next time, try a few more reps or hold a little longer.</p>` : ''}</div>`;
    foot = `<div class="fa-foot-in one"><button class="btn primary" data-act="close-fa">Done</button></div>`;
  } else if (F.phase === 'rest') {
    const nx = EXM[F.ex[F.i]], t = F.t;
    top = `<span class="count">Rest · next is ${F.i + 1} of ${n}</span><button class="btn small" data-act="end">${ico('close')}End</button>`;
    body = `${confirm}<div class="center-page"><h1 style="font-size:1.8rem">Rest</h1>
      <div class="timer" id="timer" style="width:100%">${ringHTML(t)}<div class="timer-side"><span class="${t.state === 'done' ? 'done-msg' : 'lbl'}">${t.state === 'done' ? 'Ready when you are.' : 'Catch your breath.'}</span><span class="sub">Have a sip of water.</span></div></div>
      <div class="card" style="width:100%;text-align:left"><span class="eyebrow">Up next</span><h2 style="font-size:1.3rem;margin-top:6px">${esc(nx.name)}</h2><p class="muted">${POS[nx.position]} · ${esc(nx.dose)}</p></div></div>`;
    foot = `<div class="fa-foot-in"><button class="btn" data-act="prev">${ico('back')}Back</button><button class="btn primary" data-act="ready">I'm ready ${ico('next')}</button></div>`;
  } else {
    const e = EXM[F.ex[F.i]];
    top = `<span class="count">Exercise ${F.i + 1} of ${n}</span><button class="btn small" data-act="end">${ico('close')}End</button>`;
    body = `${confirm}${exBody(e)}`;
    foot = `<div class="fa-foot-in"><button class="btn" data-act="prev" ${F.i === 0 ? 'disabled' : ''}>${ico('back')}Back</button>${primaryFor()}</div>`;
  }
  const pct = F.phase === 'finished' ? 100 : F.phase === 'ready' ? 0 : (F.i / n) * 100;
  overlay.innerHTML = `<div class="fa" role="dialog" aria-modal="true" aria-label="${esc(F.prog.name)}">
    <div class="fa-top"><div class="fa-top-in">${top}</div><div class="bar"><div style="width:${pct}%"></div></div></div>
    <div class="fa-body" style="${F.phase === 'ex' ? catVar(EXM[F.ex[F.i]].category) : ''}">${body}</div>
    <div class="fa-foot">${foot}</div></div>`;
}
function faFocusTop(){ const fa = overlay.querySelector('.fa'); if (fa) fa.scrollTop = 0; const h = overlay.querySelector('h1'); if (h) { h.setAttribute('tabindex', '-1'); try { h.focus({preventScroll:true}); } catch {} } }
function enterEx(i){
  stopSpeak(); F.i = i; F.phase = 'ex'; F.confirm = false; loadEx(); saveActive(); renderFA(); faFocusTop();
  if (S.autoRead && canSpeak) say(exText(EXM[F.ex[F.i]]), F.ex[F.i]);
}
function nextStep(){
  stopSpeak(); F.confirm = false;
  if (F.i >= F.ex.length - 1) return finish();
  F.i++; saveActive();
  if (S.rest > 0) { F.phase = 'rest'; restLoad(); renderFA(); faFocusTop(); }
  else enterEx(F.i);
}
function logSession(count){
  const mins = Math.max(1, Math.round((Date.now() - F.began) / 60000));
  S.log.push({date: todayKey(), prog: F.prog.id, name: F.prog.name, sessName: F.prog.id === 'single' ? '' : F.sessName, count, mins, feel: null});
  if (S.log.length > 500) S.log = S.log.slice(-500);
  F.logIdx = S.log.length - 1;
}
function finish(){
  clearInterval(tick); tick = null;
  logSession(F.ex.length);
  if (PM[F.prog.id]) S.progress[F.prog.id] = (F.sess + 1) % F.prog.sessions.length;
  if (S.swap && S.swap.date !== todayKey()) S.swap = null;
  S.active = null; save();
  F.phase = 'finished'; keepAwake(false); renderFA(); faFocusTop();
}
function closeFA(fromPop){
  clearInterval(tick); tick = null; F = null; keepAwake(false); stopSpeak();
  renderFA(); if (!fromPop) { ignorePop++; goBackSilently(); } render({top: true});
}

/* ---------- Events ---------- */
document.getElementById('size-btn').addEventListener('click', sizeSheet);
document.getElementById('set-btn').innerHTML = ico('gear');
document.getElementById('set-btn').addEventListener('click', () => go({tab: V.tab, page: 'settings'}));
document.getElementById('theme-btn').addEventListener('click', () => { S.theme = darkNow() ? 'light' : 'dark'; save(); applyPrefs(); if (V.page === 'settings') render(); toast(darkNow() ? 'Dark colors on' : 'Light colors on'); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (T) endTour(); else if (overlay.querySelector('.sheet-wrap')) closeSheet(); else if (F && F.phase !== 'finished') { F.confirm = true; renderFA(); } } });
document.addEventListener('input', e => {
  if (e.target.id === 'fb-text') { fb.text = e.target.value; const has = fb.text.trim() || fb.kind;
    // update send links without re-rendering (keeps the keyboard open)
    const sms = document.getElementById('fb-sms'), mail = document.getElementById('fb-mail'), copy = main.querySelector('[data-act="fb-copy"]');
    const body = encodeURIComponent(fbBody());
    if (has) { sms.href = `sms:${FEEDBACK.phone}${/iPhone|iPad/.test(navigator.userAgent) ? '&' : '?'}body=${body}`; mail.href = `mailto:${FEEDBACK.email}?subject=${encodeURIComponent('Willow feedback')}&body=${body}`; sms.removeAttribute('aria-disabled'); mail.removeAttribute('aria-disabled'); copy.disabled = false; }
  }
  if (e.target.id === 'remind-time') { S.remind = e.target.value || '09:00'; save(); }
});
document.addEventListener('click', ev => {
  const t = ev.target.closest('button, a[aria-disabled], [data-close-sheet]');
  if (!t) return;
  if (t.matches('a[aria-disabled="true"]')) { ev.preventDefault(); return; }
  const d = t.dataset;
  if (d.closeSheet !== undefined && (t.tagName === 'BUTTON' || ev.target === t)) return closeSheet();
  // tour
  if (T) { if (d.tourNext !== undefined) return tourStep(T.i + 1); if (d.tourBack !== undefined) return tourStep(T.i - 1); if (d.tourEnd !== undefined) return endTour(); return; }
  if (d.tour !== undefined) { S.welcomed = true; save(); return startTour(); }
  // follow-along
  if (F) {
    const a = d.act;
    if (a === 'begin') return enterEx(F.i);
    if (a === 't-start') return timerStart();
    if (a === 't-pause') return timerPause();
    if (a === 't-reset') return timerReset();
    if (a === 'next') return nextStep();
    if (a === 'ready') return enterEx(F.i);
    if (a === 'prev') { if (F.phase === 'rest') return enterEx(F.i - 1); if (F.i > 0) return enterEx(F.i - 1); return; }
    if (a === 'end') { F.confirm = true; renderFA(); faFocusTop(); return; }
    if (a === 'keep') { F.confirm = false; return renderFA(); }
    if (a === 'end-now') { if (S.active && S.active.i === 0) { S.active = null; save(); } return closeFA(); }
    if (a === 'confirm-end') { const doneN = F.i + (F.t && F.t.state === 'done' ? 1 : 0); if (doneN > 0) { logSession(doneN); } save(); return closeFA(); }
    if (d.feel) { F.feel = d.feel; if (F.logIdx != null && S.log[F.logIdx]) { S.log[F.logIdx].feel = d.feel; save(); } return renderFA(); }
    if (a === 'close-fa') return closeFA();
    if (d.speak) return toggleRead(EXM[d.speak]);
    return;
  }
  if (d.tab) return go({tab: d.tab});
  if (d.back !== undefined) return goBack();
  if (d.go) return go({tab: V.tab, page: d.go, id: d.id});
  if (d.openProgram) return go({tab: V.tab, page: 'program', id: d.openProgram});
  if (d.openEx) return go({tab: V.tab, page: 'exercise', id: d.openEx});
  if (d.start) { const p = getProgram(d.start); if (p) startSession(p, +d.sess || 0); return; }
  if (d.startEx) { const e = EXM[d.startEx]; startSession({id:'single', name:e.name, cat:e.category, sessions:[{name:e.name, ex:[e.id]}]}, 0); return; }
  if (d.filter) { exFilter = d.filter; return render(); }
  if (d.fav) { const i = S.favs.indexOf(d.fav); i < 0 ? S.favs.push(d.fav) : S.favs.splice(i, 1); save(); toast(i < 0 ? 'Saved to favorites' : 'Removed from favorites'); return render(); }
  if (d.speak) return toggleRead(EXM[d.speak]);
  if (d.size) { S.size = d.size; save(); applyPrefs(); if (overlay.querySelector('.sheet')) { overlay.querySelectorAll('.opt').forEach(o => { const on = o.dataset.size === S.size; o.classList.toggle('on', on); o.setAttribute('aria-pressed', on); o.querySelector('.chk') && o.querySelector('.chk').remove(); if (on) o.insertAdjacentHTML('beforeend', ico('check', 'chk')); }); } return render({keepScroll: true}); }
  if (d.themeSet) { S.theme = d.themeSet; save(); applyPrefs(); return render(); }
  if (d.rest) { S.rest = +d.rest; save(); return render(); }
  if (d.walk) { S.log.push({date: todayKey(), kind: 'walk', name: 'Walk', mins: +d.walk}); save(); toast(`${d.walk} minutes logged. Well done.`); return goBack(); }
  if (d.fbKind) { fb.kind = fb.kind === d.fbKind ? '' : d.fbKind; return render({keepScroll: true}); }
  const a = d.act;
  if (a === 'welcomed') { S.welcomed = true; save(); return render(); }
  if (a === 'hide-install') { S.installHidden = true; save(); return render(); }
  if (a === 'seated') { S.seatedOnly = !S.seatedOnly; save(); return render({keepScroll: true}); }
  if (a === 'gentler') { const cur = todaysProgram().p; const pick = GENTLER.find(id => id !== cur.id) || 'taichi-seated'; S.swap = {date: todayKey(), prog: pick}; save(); toast('Switched to something gentler'); return render(); }
  if (a === 'unswap') { S.swap = null; save(); return render(); }
  if (a === 'resume') { const r = S.active, p = PM[r.prog]; if (p) startSession(p, r.sess, r.i); return; }
  if (a === 'drop-resume') { S.active = null; save(); return render(); }
  if (a === 'sound') { S.sound = !S.sound; save(); if (S.sound) { unlockAudio(); chime(); } return render({keepScroll: true}); }
  if (a === 'autoread') { S.autoRead = !S.autoRead; save(); return render({keepScroll: true}); }
  if (a === 'wake') { S.wake = !S.wake; save(); return render({keepScroll: true}); }
  if (a === 'clear-ask') { confirmClear = true; settingsMsg = ''; return render({keepScroll: true}); }
  if (a === 'clear-no') { confirmClear = false; return render({keepScroll: true}); }
  if (a === 'clear-yes') { S.log = []; S.progress = {}; S.active = null; confirmClear = false; settingsMsg = 'Your history is cleared.'; save(); return render({keepScroll: true}); }
  if (a === 'remind') return addReminder();
  if (a === 'share-week') return shareWeek();
  if (a === 'fb-copy') return copyText(fbBody(), m => { fb.msg = m; render({keepScroll: true}); });
});
async function copyText(text, done){
  try { await navigator.clipboard.writeText(text); done('Copied. Paste it into a text or email.'); }
  catch { done('Copying is blocked here. Long-press the message box to copy it instead.'); }
}
async function shareWeek(){
  const text = shareText();
  try { if (navigator.share) { await navigator.share({text}); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
  const href = `sms:${FEEDBACK.phone}${/iPhone|iPad/.test(navigator.userAgent) ? '&' : '?'}body=${encodeURIComponent(text)}`;
  const a = document.createElement('a'); a.href = href; a.click();
  copyText(text, m => toast(m));
}
function addReminder(){
  const [hh, mm] = (S.remind || '09:00').split(':').map(Number);
  const d = new Date(); d.setHours(hh, mm, 0, 0);
  const p2 = n => String(n).padStart(2, '0');
  const dt = `${d.getFullYear()}${p2(d.getMonth()+1)}${p2(d.getDate())}T${p2(hh)}${p2(mm)}00`;
  const end = `${d.getFullYear()}${p2(d.getMonth()+1)}${p2(d.getDate())}T${p2(hh)}${p2((mm + 15) % 60)}00`;
  const url = EMBED ? location.href.split('#')[0] : '';
  const ics = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Willow//EN','BEGIN:VEVENT',`UID:willow-${Date.now()}@willow`,`DTSTAMP:${dt}`,`DTSTART:${dt}`,`DTEND:${hh*60+mm+15 >= 1440 ? dt : end}`,
    'RRULE:FREQ=DAILY','SUMMARY:Willow exercises',`DESCRIPTION:Time for today's Willow routine. ${url}`,'BEGIN:VALARM','TRIGGER:PT0M','ACTION:DISPLAY','DESCRIPTION:Willow exercises','END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');
  try {
    const blob = new Blob([ics], {type: 'text/calendar'}); const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'willow-reminder.ics'; document.body.appendChild(a); a.click(); a.remove();
    settingsMsg = 'Your phone should offer to add it to your calendar. Tap Add.';
  } catch { settingsMsg = 'This phone could not make the reminder.'; }
  render({keepScroll: true});
}

/* ---------- Tour ---------- */
const TOUR = [
  {sel:null, tab:'today', title:'Welcome to Willow', text:"Here's a quick look around. It takes about a minute. Tap <b>Next</b> to keep going, or <b>Close</b> anytime.", pic:'leaf'},
  {sel:'.today-card', tab:'today', title:"Today's routine", text:'Each day a short routine is ready here. Tap the green <b>Start</b> button and Willow walks you through it.'},
  {sel:'[data-act="gentler"]', tab:'today', title:'Not up to it today?', text:'Tap <b>Something gentler</b> for an easy seated routine instead.'},
  {sel:'.week', tab:'today', title:'Your week', text:'Each day you move, a leaf fills in. Below it, you can see your strength and balance days.'},
  {sel:'.hdr-in', tab:'today', title:'Bigger words, darker colors', text:'At the top: the <b>moon</b> switches to dark colors, <b>AA</b> changes the text size, and the <b>gear</b> opens Settings.'},
  {sel:'[data-tab="programs"]', tab:'programs', title:'Programs', text:'More routines to choose from. Each one has a few versions that take turns, so it changes each time.'},
  {sel:'[data-tab="exercises"]', tab:'exercises', title:'Exercises', text:'Every exercise on its own, each with a video. Tap the <b>heart</b> to save a favorite.'},
  {sel:'[data-tab="week"]', tab:'week', title:'My Week', text:'See what you\'ve done, log a walk, or share your week with family.'},
  {sel:'.pfoot', tab:'today', title:'Help is always at the bottom', text:'Scroll to the bottom of any page for <b>Settings</b>, <b>Help</b>, this <b>tour</b>, and <b>Send feedback</b>.'},
  {sel:null, tab:'today', title:'During a routine', text:'You see one exercise at a time.<ol class="tour-list"><li>Watch the video.</li><li>Use the big button at the bottom: <b>Start timer</b> or <b>I\'m done</b>.</li><li>Rest, then tap <b>I\'m ready</b>.</li></ol>Tap <b>End</b> anytime. What you did still counts.', pic:'play'},
  {sel:null, tab:'today', title:"You're all set", text:'Check with your doctor before starting a new routine. Stop and rest if anything hurts or you feel dizzy.<br><br>Enjoy moving!', pic:'shield'}
];
function startTour(){ if (F) return; overlay.innerHTML = ''; T = {i: 0}; hpush({tour: true}); V = {tab: 'today'}; render({top: true}); tourStep(0); }
function endTour(fromPop){ T = null; tourEl.innerHTML = ''; if (!fromPop) { ignorePop++; goBackSilently(); } V = {tab: 'today'}; render({top: true, focus: true}); }
function tourStep(i){
  if (i < 0) return; if (i >= TOUR.length) return endTour();
  T.i = i; const s = TOUR[i];
  if (V.tab !== s.tab || V.page) { V = {tab: s.tab}; render(); }
  const target = s.sel ? document.querySelector(s.sel) : null;
  if (target && !target.closest('.tabs, .hdr')) { const r = target.getBoundingClientRect(); window.scrollTo({top: Math.max(0, r.top + window.scrollY - (window.innerHeight - r.height) / 2), behavior: 'instant'}); }
  else if (!target || target.closest('.hdr')) window.scrollTo(0, 0);
  requestAnimationFrame(() => drawTour(target));
}
function holeRect(target){ const vh = innerHeight, vw = innerWidth, pad = 8, r = target.getBoundingClientRect();
  const top = Math.max(4, r.top - pad), left = Math.max(4, r.left - pad); return {top, left, w: Math.min(vw - 4, r.right + pad) - left, h: Math.min(vh - 4, r.bottom + pad) - top}; }
function placeTour(target){
  const card = tourEl.querySelector('.tour-card'), holeEl = tourEl.querySelector('.tour-hole'); if (!card || !target) return;
  const vh = innerHeight, gap = 12, margin = 10; let hr = holeRect(target); const ch = card.offsetHeight;
  if (!(hr.top + hr.h + gap + ch <= vh - margin) && !(hr.top - gap - ch >= margin) && !target.closest('.tabs, .hdr')) {
    window.scrollTo({top: Math.max(0, target.getBoundingClientRect().top + window.scrollY - 76), behavior: 'instant'}); hr = holeRect(target); }
  Object.assign(holeEl.style, {top: hr.top + 'px', left: hr.left + 'px', width: hr.w + 'px', height: hr.h + 'px'});
  card.style.bottom = ''; card.style.maxHeight = ''; let top;
  if (hr.top + hr.h + gap + ch <= vh - margin) top = hr.top + hr.h + gap;
  else if (hr.top - gap - ch >= margin) top = hr.top - gap - ch;
  else { const maxH = Math.min(ch, Math.max(260, vh * .6)); card.style.maxHeight = maxH + 'px'; top = vh - margin - maxH; }
  card.style.top = Math.max(margin, Math.min(top, vh - margin - Math.min(ch, vh - 2 * margin))) + 'px'; card.style.visibility = '';
}
function drawTour(target){
  if (!T) return; const s = TOUR[T.i], n = TOUR.length, last = T.i === n - 1, centered = !target;
  tourEl.innerHTML = `<div class="tour-layer${centered ? ' dim' : ''}">${target ? '<div class="tour-hole"></div>' : ''}
    <div class="tour-card${centered ? ' center' : ''}" style="${centered ? '' : 'visibility:hidden;top:0'}" role="dialog" aria-modal="true" aria-labelledby="tour-t">
      ${s.pic ? `<div class="tour-pic">${ico(s.pic)}</div>` : ''}
      <div class="tour-dots" aria-label="Step ${T.i + 1} of ${n}">${TOUR.map((_, k) => `<i class="${k === T.i ? 'on' : k < T.i ? 'past' : ''}"></i>`).join('')}</div>
      <h2 id="tour-t">${s.title}</h2><div class="tour-text">${s.text}</div>
      <div class="tour-foot"><div class="tour-btns">
        ${T.i > 0 ? `<button class="btn small" data-tour-back>${ico('back')}Back</button>` : `<button class="btn small" data-tour-end>Close</button>`}
        <button class="btn primary small" data-tour-next id="tour-next">${last ? 'Start using Willow' : 'Next ' + ico('next')}</button></div>
        ${T.i > 0 && !last ? `<button class="btn link" data-tour-end>Close the tour</button>` : ''}</div></div></div>`;
  placeTour(target); const nb = document.getElementById('tour-next'); if (nb) nb.focus({preventScroll: true});
}
window.addEventListener('resize', () => { if (T) { const s = TOUR[T.i]; drawTour(s.sel ? document.querySelector(s.sel) : null); } });

/* ---------- Offline (installed app only) ---------- */
if (EMBED && 'serviceWorker' in navigator && location.protocol === 'https:') { try { navigator.serviceWorker.register('sw.js'); } catch {} }

applyPrefs();
render({top: true});
})();
</script>
